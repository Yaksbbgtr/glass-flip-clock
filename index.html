<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131b" />
    <title>Glass Flip Clock</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8fbff;
        --muted: rgba(240, 246, 255, .58);
        --glass-edge: rgba(255,255,255,.27);
        /* Card size is driven by the viewport (width and height) so six cards + dividers always fit inside the panel. */
        --card-w: min(10.5vw, 26vh, 120px);
        --card-h: calc(var(--card-w) * 1.5);
        --digit: calc(var(--card-w) * 1.28);
        --radius: calc(var(--card-w) * .16);
        --flip-ms: 520ms;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; min-height: 100dvh; overflow: hidden; display: grid; place-items: center;
        font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
        color: var(--ink); background: #0b0d14;
      }
      .aurora, .aurora::before, .aurora::after { position: fixed; inset: -25vmax; content: ""; pointer-events: none; }
      .aurora { background: radial-gradient(circle at 31% 33%, #526ec8 0 7%, transparent 24%), radial-gradient(circle at 71% 62%, #aa5da9 0 5%, transparent 25%), linear-gradient(128deg, #0c1221, #18182b 44%, #17101d); filter: blur(28px); animation: drift 16s ease-in-out infinite alternate; }
      .aurora::before { background: radial-gradient(circle at 50% 40%, rgba(85, 242, 222, .25), transparent 18%); transform: translate(-12%, 17%); }
      .aurora::after { background: radial-gradient(circle at 50% 50%, transparent 34%, rgba(0, 0, 0, .42) 91%); }
      @keyframes drift { to { transform: scale(1.08) rotate(5deg); } }
      .shell {
        width: min(92vw, 1060px); padding: clamp(20px, 4vw, 43px); position: relative;
        border-radius: 39px; border: 1px solid var(--glass-edge);
        background: linear-gradient(135deg, rgba(255,255,255,.19), rgba(255,255,255,.045) 35%, rgba(255,255,255,.08));
        box-shadow: 0 30px 90px rgba(0,0,0,.38), inset 0 1px 1px rgba(255,255,255,.35);
        backdrop-filter: blur(34px) saturate(155%); -webkit-backdrop-filter: blur(34px) saturate(155%);
      }
      .shell::before { content:""; position: absolute; inset: 0; border-radius: inherit; pointer-events:none; background: linear-gradient(116deg, rgba(255,255,255,.15), transparent 28%); }
      header { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: clamp(22px, 5vw, 48px); }
      .brand { display: flex; align-items: center; gap: 10px; letter-spacing: .13em; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.75); text-transform: uppercase; }
      .orb { width: 13px; height: 13px; border-radius: 50%; background: linear-gradient(145deg, #fff, #98d4ff 48%, #6478ff); box-shadow: 0 0 20px #8bc8ff; }
      .date { font-size: 12px; color: var(--muted); font-weight: 550; text-align: right; }
      .clock { display: flex; align-items: center; justify-content: center; gap: clamp(6px, 1.5vw, 20px); position: relative; }
      .unit { display: flex; gap: clamp(4px, .9vw, 12px); }
      .divider { font-size: calc(var(--card-w) * .6); font-family: ui-monospace, monospace; font-weight: 200; line-height: 1; color: rgba(255,255,255,.72); text-shadow: 0 0 20px rgba(255,255,255,.25); animation: pulse 1s steps(1) infinite; }
      @keyframes pulse { 50% { opacity: .22; } }
      .card { position: relative; flex: none; width: var(--card-w); height: var(--card-h); perspective: calc(var(--card-h) * 4); filter: drop-shadow(0 16px 16px rgba(0,0,0,.2)); }
      .card-base, .half, .flip { position: absolute; left: 0; width: 100%; overflow: hidden; border: 1px solid rgba(255,255,255,.3); background: linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.055)); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
      .card-base { inset: 0; border-radius: var(--radius); box-shadow: inset 0 1px 1px rgba(255,255,255,.22), inset 0 -1px 1px rgba(0,0,0,.32); }
      .half, .flip { height: 50%; z-index: 2; }
      .top, .flip-top { top: 0; border-radius: var(--radius) var(--radius) 4px 4px; border-bottom-color: rgba(0,0,0,.18); }
      .bottom, .flip-bottom { bottom: 0; border-radius: 4px 4px var(--radius) var(--radius); border-top-color: rgba(255,255,255,.16); }
      /* Each half holds a full-height digit and clips it: the top half shows the upper part, the bottom half the lower part.
         The -1px offsets cancel the half's border so both halves line up exactly at the seam. */
      .number { position: absolute; left: -1px; right: -1px; height: var(--card-h); display: grid; place-items: center; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: var(--digit); font-weight: 500; line-height: 1; color: #fff; text-shadow: 0 2px 7px rgba(0,0,0,.16); font-variant-numeric: tabular-nums; }
      .top .number, .flip-top .number { top: -1px; }
      .bottom .number, .flip-bottom .number { bottom: -1px; }
      .seam { position: absolute; left: 5%; width: 90%; top: 50%; height: 1px; background: rgba(1,4,12,.34); box-shadow: 0 1px rgba(255,255,255,.12); z-index: 4; }
      .flip { z-index: 3; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
      .flip-top { transform-origin: bottom; }
      .flip-bottom { transform-origin: top; transform: rotateX(90deg); }
      .card.flipping .flip-top { animation: fold calc(var(--flip-ms) * .46) ease-in forwards; }
      .card.flipping .flip-bottom { animation: unfold calc(var(--flip-ms) * .54) calc(var(--flip-ms) * .46) ease-out forwards; }
      /* The glass is translucent, so fade the digits that sit under a moving flap to avoid two digits overlapping. */
      .card.flipping .top .number { animation: reveal calc(var(--flip-ms) * .46) ease-in both; }
      .card.flipping .bottom .number { animation: conceal calc(var(--flip-ms) * .54) calc(var(--flip-ms) * .46) ease-out both; }
      @keyframes reveal { from { opacity: 0; } }
      @keyframes conceal { to { opacity: 0; } }
      @keyframes fold { to { transform: rotateX(-90deg); filter: brightness(.65); } }
      @keyframes unfold { to { transform: rotateX(0); } }
      footer { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: clamp(22px, 5vw, 45px); color: var(--muted); font-size: 11px; }
      .zone { display: flex; gap: 8px; align-items: center; letter-spacing: .08em; }
      .zone strong { font: 600 15px ui-monospace, monospace; color: var(--ink); letter-spacing: .05em; }
      .zone strong:empty { display: none; }
      button { color: inherit; border: 0; background: none; font: inherit; cursor: pointer; padding: 7px 0; opacity: .8; border-radius: 6px; }
      button:hover { opacity: 1; }
      button:focus-visible { outline: 2px solid #98d4ff; outline-offset: 3px; opacity: 1; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      @media (max-width: 560px) {
        :root { --card-w: min(calc((92vw - 64px) / 6), 26vh); }
        .shell { border-radius: 29px; padding: 22px 15px; }
        .clock { gap: 8px; } .unit { gap: 3px; } .divider { display: none; }
        header { margin-bottom: 30px; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; } }
    </style>
  </head>
  <body>
    <div class="aurora"></div>
    <main class="shell">
      <header><div class="brand"><i class="orb"></i> Timepiece</div><div class="date" id="date"></div></header>
      <section class="clock" aria-label="Current time">
        <span class="sr-only" id="sr-time" aria-live="off"></span>
        <div class="unit" id="hours"></div><div class="divider" aria-hidden="true">:</div><div class="unit" id="minutes"></div><div class="divider" aria-hidden="true">:</div><div class="unit" id="seconds"></div>
      </section>
      <footer><button id="mode" type="button" aria-pressed="true">24-hour time</button><div class="zone"><strong id="period"></strong><span id="tz"></span></div></footer>
    </main>
    <script>
      const pad = n => String(n).padStart(2, '0');
      const FLIP_MS = 520;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const cards = {};

      let is24 = true;
      try { is24 = localStorage.getItem('clock-format') !== '12'; } catch (e) {}

      function makeCard(digit) {
        const el = document.createElement('div');
        el.className = 'card';
        el.setAttribute('aria-hidden', 'true');
        el.innerHTML = `<div class="card-base"></div><div class="half top"><span class="number"></span></div><div class="half bottom"><span class="number"></span></div><div class="flip flip-top"><span class="number"></span></div><div class="flip flip-bottom"><span class="number"></span></div><div class="seam"></div>`;
        const n = sel => el.querySelector(sel + ' .number');
        const card = { el, value: digit, timer: 0, top: n('.top'), bottom: n('.bottom'), flipTop: n('.flip-top'), flipBottom: n('.flip-bottom') };
        setAll(card, digit);
        return card;
      }

      function setAll(card, digit) {
        card.top.textContent = card.bottom.textContent = card.flipTop.textContent = card.flipBottom.textContent = digit;
      }

      // Real flip: the upper flap carries the OLD digit down and reveals the NEW digit behind it,
      // then the lower flap lands with the NEW digit over the old lower half.
      function flipTo(card, digit) {
        if (card.value === digit) return;
        const old = card.value;
        card.value = digit;
        clearTimeout(card.timer);
        card.el.classList.remove('flipping');
        if (reduceMotion.matches || document.hidden) { setAll(card, digit); return; }
        card.top.textContent = digit;
        card.flipTop.textContent = old;
        card.flipBottom.textContent = digit;
        card.bottom.textContent = old;
        void card.el.offsetWidth; // restart the animation
        card.el.classList.add('flipping');
        card.timer = setTimeout(() => {
          card.bottom.textContent = card.flipTop.textContent = digit;
          card.el.classList.remove('flipping');
          card.timer = 0;
        }, FLIP_MS);
      }

      function setPair(id, value) { pad(value).split('').forEach((d, i) => flipTo(cards[id][i], d)); }

      function hourValue(now) { const h = now.getHours(); return is24 ? h : (h % 12 || 12); }

      function render(now) {
        setPair('hours', hourValue(now));
        setPair('minutes', now.getMinutes());
        setPair('seconds', now.getSeconds());
        const period = now.getHours() < 12 ? 'AM' : 'PM';
        document.getElementById('period').textContent = is24 ? '' : period;
        document.getElementById('sr-time').textContent = `${pad(hourValue(now))}:${pad(now.getMinutes())}${is24 ? '' : ' ' + period}`;
        document.getElementById('date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
        const tz = new Intl.DateTimeFormat(undefined, { timeZoneName: 'short' }).formatToParts(now).find(p => p.type === 'timeZoneName');
        document.getElementById('tz').textContent = tz ? tz.value : '';
      }

      function renderMode() {
        const btn = document.getElementById('mode');
        btn.textContent = is24 ? '24-hour time' : '12-hour time';
        btn.setAttribute('aria-pressed', String(is24));
      }

      // Build the cards already showing the current time, so nothing flips on page load.
      const start = new Date();
      [['hours', hourValue(start)], ['minutes', start.getMinutes()], ['seconds', start.getSeconds()]].forEach(([id, v]) => {
        cards[id] = pad(v).split('').map(makeCard);
        document.getElementById(id).append(...cards[id].map(c => c.el));
      });

      document.getElementById('mode').addEventListener('click', () => {
        is24 = !is24;
        try { localStorage.setItem('clock-format', is24 ? '24' : '12'); } catch (e) {}
        renderMode();
        render(new Date());
      });

      // Tick right after each second boundary instead of a drifting setInterval.
      function tick() { render(new Date()); setTimeout(tick, 1000 - (Date.now() % 1000) + 10); }
      renderMode();
      tick();
    </script>
  </body>
</html>
