<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Flip Clock</title>
    <style>
      @font-face { font-family: "Oswald"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/Oswald-600.woff2") format("woff2"); }
      :root {
        color-scheme: dark;
        --bg: #000;
        --card: #121212;
        --ink: #b9b9b9;
        /* Two square cards side by side in landscape; stacked in portrait. */
        --size: min(42vw, 78vh);
        --radius: calc(var(--size) * .085);
        --seam: max(2px, calc(var(--size) * .007));
        --flip-ms: 600ms;
        --type: "Oswald", "Bebas Neue", "Helvetica Neue Condensed Bold", "Arial Narrow", Impact, sans-serif;
      }
      @media (orientation: portrait) { :root { --size: min(82vw, 43vh); } }
      /* Three cards when seconds are on. */
      body.with-seconds { --size: min(29vw, 74vh); }
      @media (orientation: portrait) { body.with-seconds { --size: min(82vw, 28.5vh); } }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; overflow: hidden; display: grid; place-items: center;
        background: var(--bg); font-family: var(--type); color: var(--ink);
        -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
      }
      .clock { display: flex; gap: calc(var(--size) * .08); align-items: center; justify-content: center; }
      @media (orientation: portrait) { .clock { flex-direction: column; gap: calc(var(--size) * .05); } }

      .card { position: relative; width: var(--size); height: var(--size); perspective: calc(var(--size) * 4); }
      .half, .flip { position: absolute; left: 0; width: 100%; height: 50%; overflow: hidden; background: var(--card); }
      .top, .flip-top { top: 0; border-radius: var(--radius) var(--radius) 0 0; }
      .bottom, .flip-bottom { bottom: 0; border-radius: 0 0 var(--radius) var(--radius); }
      /* Each half holds a full-height number and clips it, so the halves meet exactly at the seam. */
      .number {
        position: absolute; left: 0; right: 0; height: var(--size);
        display: grid; place-items: center;
        font-size: calc(var(--size) * .86); font-weight: 600; line-height: 1; letter-spacing: -.01em;
        font-variant-numeric: tabular-nums; color: var(--ink);
      }
      .top .number, .flip-top .number { top: 0; }
      .bottom .number, .flip-bottom .number { bottom: 0; }
      .seam { position: absolute; left: 0; right: 0; top: calc(50% - var(--seam) / 2); height: var(--seam); background: var(--bg); z-index: 4; }
      .period { position: absolute; z-index: 5; left: 7%; top: 9%; font-size: calc(var(--size) * .085); line-height: 1; letter-spacing: .01em; }
      .period:empty { display: none; }

      .flip { z-index: 3; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
      .flip-top { transform-origin: bottom; }
      .flip-bottom { transform-origin: top; transform: rotateX(90deg); }
      .card.flipping .flip-top { animation: fold calc(var(--flip-ms) * .5) ease-in forwards; }
      .card.flipping .flip-bottom { animation: unfold calc(var(--flip-ms) * .5) calc(var(--flip-ms) * .5) ease-out forwards; }
      @keyframes fold { to { transform: rotateX(-90deg); filter: brightness(.45); } }
      @keyframes unfold { from { filter: brightness(.6); } to { transform: rotateX(0); filter: none; } }

      /* Hamburger menu: top-right, fades out when the mouse is idle. */
      .menu { position: fixed; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); z-index: 10; transition: opacity .4s; }
      body.idle .menu:not(.open):not(:focus-within) { opacity: 0; }
      body.idle { cursor: none; }
      .burger {
        display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
        background: none; color: #6a6a6a; cursor: pointer; transition: color .2s, background .2s;
      }
      .burger:hover, .menu.open .burger { color: var(--ink); background: #141414; }
      .burger:focus-visible { outline: 1px solid #555; outline-offset: 2px; }
      .burger svg { width: 20px; height: 20px; }
      .burger .close-icon, .menu.open .burger .open-icon { display: none; }
      .menu.open .burger .close-icon { display: block; }
      .panel {
        position: absolute; top: 52px; right: 0; min-width: 190px; padding: 6px; border-radius: 14px;
        background: #141414; box-shadow: 0 10px 40px rgba(0,0,0,.6); opacity: 0; transform: translateY(-6px); pointer-events: none;
        transition: opacity .2s, transform .2s;
      }
      .menu.open .panel { opacity: 1; transform: none; pointer-events: auto; }
      .switch {
        display: flex; align-items: center; justify-content: space-between; gap: 18px; width: 100%; padding: 12px 14px; border: 0; border-radius: 10px;
        background: none; color: #8a8a8a; font: 600 13px/1 var(--type); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; text-align: left;
      }
      .switch:hover { color: var(--ink); background: #1c1c1c; }
      .switch:focus-visible { outline: 1px solid #555; outline-offset: -1px; }
      .track { position: relative; flex: none; width: 38px; height: 22px; border-radius: 999px; background: #262626; transition: background .25s; }
      .knob { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #5a5a5a; transition: transform .25s, background .25s; }
      .switch[aria-checked="true"] { color: var(--ink); }
      .switch[aria-checked="true"] .track { background: #3a3a3a; }
      .switch[aria-checked="true"] .knob { transform: translateX(16px); background: var(--ink); }

      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; } }
    </style>
  </head>
  <body>
    <div class="clock" role="timer" aria-label="Current time">
      <span class="sr-only" id="sr-time"></span>
      <span class="card" id="hours" aria-hidden="true"><span class="period" id="period"></span></span>
      <span class="card" id="minutes" aria-hidden="true"></span>
      <span class="card" id="seconds" aria-hidden="true" hidden></span>
    </div>
    <nav class="menu" id="menu" aria-label="Settings">
      <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="panel" aria-label="Settings">
        <svg class="open-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
        <svg class="close-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
      <div class="panel" id="panel">
        <button class="switch" id="hour-switch" type="button" role="switch" aria-checked="false">24-hour<span class="track" aria-hidden="true"><span class="knob"></span></span></button>
        <button class="switch" id="sec-switch" type="button" role="switch" aria-checked="false">Seconds<span class="track" aria-hidden="true"><span class="knob"></span></span></button>
        <button class="switch" id="widget-settings" type="button" hidden>Widget settings…</button>
      </div>
    </nav>
    <script>
      const pad = n => String(n).padStart(2, '0');
      const FLIP_MS = 600;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      let is24 = false;
      try { is24 = localStorage.getItem('clock-format') === '24'; } catch (e) {}

      function makeCard(el, value) {
        el.insertAdjacentHTML('afterbegin', `<span class="half top"><span class="number"></span></span><span class="half bottom"><span class="number"></span></span><span class="flip flip-top"><span class="number"></span></span><span class="flip flip-bottom"><span class="number"></span></span><span class="seam"></span>`);
        const n = sel => el.querySelector(sel + ' .number');
        const card = { el, value, timer: 0, top: n('.top'), bottom: n('.bottom'), flipTop: n('.flip-top'), flipBottom: n('.flip-bottom') };
        setAll(card, value);
        return card;
      }

      function setAll(card, v) { card.top.textContent = card.bottom.textContent = card.flipTop.textContent = card.flipBottom.textContent = v; }

      // The upper flap carries the old value down and reveals the new one behind it,
      // then the lower flap lands with the new value over the old lower half.
      function flipTo(card, v) {
        if (card.value === v) return;
        const old = card.value;
        card.value = v;
        clearTimeout(card.timer);
        card.el.classList.remove('flipping');
        if (reduceMotion.matches || document.hidden) { setAll(card, v); return; }
        card.top.textContent = v;
        card.flipTop.textContent = old;
        card.flipBottom.textContent = v;
        card.bottom.textContent = old;
        void card.el.offsetWidth;
        card.el.classList.add('flipping');
        card.timer = setTimeout(() => {
          card.bottom.textContent = card.flipTop.textContent = v;
          card.el.classList.remove('flipping');
        }, FLIP_MS);
      }

      const hourText = now => { const h = now.getHours(); return is24 ? pad(h) : String(h % 12 || 12); };
      const minuteText = now => pad(now.getMinutes());
      const secondText = now => pad(now.getSeconds());

      let showSeconds = false;
      try { showSeconds = localStorage.getItem('clock-seconds') === 'on'; } catch (e) {}

      const start = new Date();
      const hours = makeCard(document.getElementById('hours'), hourText(start));
      const minutes = makeCard(document.getElementById('minutes'), minuteText(start));
      const seconds = makeCard(document.getElementById('seconds'), secondText(start));

      function render(now) {
        flipTo(hours, hourText(now));
        flipTo(minutes, minuteText(now));
        if (showSeconds) flipTo(seconds, secondText(now));
        const period = now.getHours() < 12 ? 'AM' : 'PM';
        document.getElementById('period').textContent = is24 ? '' : period;
        document.getElementById('sr-time').textContent = `${hourText(now)}:${minuteText(now)}${is24 ? '' : ' ' + period}`;
      }

      const secSwitch = document.getElementById('sec-switch');
      function applySeconds() {
        document.body.classList.toggle('with-seconds', showSeconds);
        seconds.el.hidden = !showSeconds;
        secSwitch.setAttribute('aria-checked', String(showSeconds));
        if (showSeconds) { const v = secondText(new Date()); seconds.value = v; setAll(seconds, v); }
      }
      secSwitch.addEventListener('click', () => {
        showSeconds = !showSeconds;
        try { localStorage.setItem('clock-seconds', showSeconds ? 'on' : 'off'); } catch (e) {}
        applySeconds();
      });
      applySeconds();

      // Inside the Mac app, the menu also opens the native Widget Settings window.
      const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.flipclock;
      const widgetBtn = document.getElementById('widget-settings');
      if (native) {
        widgetBtn.hidden = false;
        widgetBtn.addEventListener('click', () => { native.postMessage('widget-settings'); setMenu(false); });
      }

      // Hide the menu button and cursor after a few seconds without mouse or touch activity.
      let idleTimer = 0;
      function wake() {
        document.body.classList.remove('idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
      }
      ['mousemove', 'pointerdown', 'keydown', 'touchstart'].forEach(e => window.addEventListener(e, wake, { passive: true }));
      wake();

      const hourSwitch = document.getElementById('hour-switch');
      hourSwitch.setAttribute('aria-checked', String(is24));
      hourSwitch.addEventListener('click', () => {
        is24 = !is24;
        try { localStorage.setItem('clock-format', is24 ? '24' : '12'); } catch (e) {}
        hourSwitch.setAttribute('aria-checked', String(is24));
        render(new Date());
      });

      const menu = document.getElementById('menu');
      const burger = document.getElementById('burger');
      function setMenu(open) {
        menu.classList.toggle('open', open);
        burger.setAttribute('aria-expanded', String(open));
      }
      burger.addEventListener('click', () => setMenu(!menu.classList.contains('open')));
      document.addEventListener('pointerdown', e => { if (!menu.contains(e.target)) setMenu(false); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') { setMenu(false); burger.blur(); } });

      // Tick just after each second boundary so the minute flips on time.
      function tick() { render(new Date()); setTimeout(tick, 1000 - (Date.now() % 1000) + 10); }
      tick();
    </script>
  </body>
</html>
